name: Upwork portfolio screenshot (synthetic demo)
on:
  push:
    branches: [portfolio-screenshot-20261110]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install headless browser
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Screenshot real app using public synthetic fixtures
        env:
          PUBLISHER_HOME: ${{ runner.temp }}/client-content-publisher-preview
        run: |
          python -m py_compile app.py core.py examples/generate_demo.py
          python app.py --port 5000 --no-browser > /tmp/publisher-server.log 2>&1 &
          sleep 3
          cat /tmp/publisher-server.log
          python - <<'PY'
          import time
          import urllib.request
          from pathlib import Path
          from examples.generate_demo import generate
          from playwright.sync_api import sync_playwright
          docx, photo = generate()
          url = "http://127.0.0.1:5000"
          for attempt in range(15):
              try:
                  urllib.request.build_opener(urllib.request.ProxyHandler({})).open(url + "/api/ping", timeout=2).read()
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError("The real publisher did not start; check printed server log")
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(viewport={"width": 1000, "height": 750}, device_scale_factor=1, locale="en-US", color_scheme="light")
              page = context.new_page()
              page.goto(url, wait_until="domcontentloaded")
              page.wait_for_selector("#lang option")
              page.select_option("#lang", "en")
              page.wait_for_function("document.documentElement.lang === 'en'")
              page.locator("#file").set_input_files([str(Path(docx).resolve()), str(Path(photo).resolve())])
              page.wait_for_selector(".scard", timeout=30000)
              page.wait_for_timeout(500)
              page.screenshot(path="upwork_publisher_preview.png", animations="disabled")
              page.locator("#expert").check()
              page.wait_for_selector(".card")
              page.locator(".card button").first.click()
              page.wait_for_selector(".card .cbody.on")
              page.wait_for_timeout(300)
              page.screenshot(path="upwork_publisher_editor.png", animations="disabled")
              print("PASS: screenshot of real running application with synthetic article and photo")
              browser.close()
          PY
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: upwork-portfolio-screenshots
          path: upwork_publisher_*.png
          retention-days: 7
      - name: Commit screenshots only to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upwork_publisher_preview.png upwork_publisher_editor.png
          git commit -m "Add verified app screenshots for Upwork portfolio" || exit 0
          git push
